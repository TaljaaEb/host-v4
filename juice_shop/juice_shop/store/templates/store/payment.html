{% extends 'base.html' %}
{% load static %}

{% block title %}Payment - Juice Shop{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-credit-card display-1 text-success"></i>
                        <h3>Complete Payment</h3>
                        <p class="text-muted">Order #{{ order.id }}</p>
                        <h2 class="text-success">${{ order.get_total_cost }}</h2>
                    </div>

                    <form id="payment-form">
                        <div id="card-element" class="mb-3 p-3 border rounded"></div>
                        <div id="card-errors" class="text-danger mb-3" role="alert"></div>
                        <button id="submit-btn" class="btn btn-success btn-lg w-100">
                            <span id="btn-text">Pay ${{ order.get_total_cost }}</span>
                            <div id="spinner" class="spinner-border spinner-border-sm d-none" role="status"></div>
                        </button>
                    </form>

                    <p class="text-muted small text-center mt-3">
                        <i class="bi bi-lock"></i> Your payment is secure and encrypted.
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://js.stripe.com/v3/"></script>
<script>
const stripe = Stripe('{{ stripe_publishable_key }}');
const elements = stripe.elements();
const card = elements.create('card', {
    style: {
        base: {
            fontSize: '16px',
            color: '#32325d',
            fontFamily: '"Helvetica Neue", Helvetica, sans-serif',
        }
    }
});
card.mount('#card-element');

card.addEventListener('change', function(event) {
    const displayError = document.getElementById('card-errors');
    if (event.error) {
        displayError.textContent = event.error.message;
    } else {
        displayError.textContent = '';
    }
});

const form = document.getElementById('payment-form');
form.addEventListener('submit', async function(ev) {
    ev.preventDefault();
    const btn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const spinner = document.getElementById('spinner');
    btn.disabled = true;
    btnText.classList.add('d-none');
    spinner.classList.remove('d-none');

    const {error, paymentIntent} = await stripe.confirmCardPayment('{{ client_secret }}', {
        payment_method: {card: card}
    });

    if (error) {
        document.getElementById('card-errors').textContent = error.message;
        btn.disabled = false;
        btnText.classList.remove('d-none');
        spinner.classList.add('d-none');
    } else if (paymentIntent.status === 'succeeded') {
        window.location.href = "{% url 'store:order_confirmation' order.id %}";
    }
});
</script>
{% endblock %}
